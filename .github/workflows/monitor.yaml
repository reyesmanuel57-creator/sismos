name: Monitor Sismico Chile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-sismico
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6 corre sobre Node 24. Node 20 se elimina de los runners
      # el 16 de septiembre de 2026, asi que v4/v5 dejarian de funcionar.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy scipy requests

      # Reintenta el motor hasta 3 veces si falla por red (USGS/Open-Meteo
      # a veces cortan). Asi una corrida no se pierde por un fallo temporal.
      - name: Escanear sismos, clima y reaprender
        env:
          WSP_APIKEY: ${{ secrets.WSP_APIKEY }}
          WSP_PHONE: ${{ secrets.WSP_PHONE }}
          WSP_GRUPO: ${{ secrets.WSP_GRUPO }}
        run: |
          for intento in 1 2 3; do
            echo "== intento $intento =="
            if python motor_adaptativo.py; then
              echo "motor OK"; break
            else
              echo "fallo intento $intento, reintentando en 30s..."
              sleep 30
            fi
          done

      - name: Publicar estado actualizado
        run: |
          cp estado_aprendizaje.json estado.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add estado.json estado_aprendizaje.json modelos_clima.json aviso_enviados.json 2>/dev/null || git add estado.json estado_aprendizaje.json modelos_clima.json
          git commit -m "Actualizacion $(date -u +'%F %H:%M')" || echo "sin cambios"
          git pull --rebase --autostash || true
          git push || echo "nada que pushear"

  # Mantiene el repo "activo" para que GitHub NO desactive el cron por
  # inactividad (lo apaga tras 60 dias sin actividad del dueño).
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Marca de actividad
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p .keepalive
          date -u +'%F %H:%M' > .keepalive/ultimo.txt
          git add .keepalive/ultimo.txt
          git commit -m "keepalive" || echo "sin cambios"
          git push || echo "nada"
