name: Monitor Sismico Chile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-sismico
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy scipy requests

      - name: Escanear sismos, clima y reaprender
        env:
          WSP_APIKEY: ${{ secrets.WSP_APIKEY }}
          WSP_PHONE: ${{ secrets.WSP_PHONE }}
          WSP_GRUPO: ${{ secrets.WSP_GRUPO }}
        run: |
          for intento in 1 2 3; do
            echo "== intento $intento =="
            if python motor_adaptativo.py; then
              echo "motor OK"; break
            else
              echo "fallo intento $intento, reintentando en 30s..."
              sleep 30
            fi
          done

      - name: Publicar estado actualizado
        run: |
          # copiar el resultado del motor al archivo que lee la web
          cp estado_aprendizaje.json estado.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # keepalive dentro del mismo job (evita que dos jobs choquen al hacer push)
          mkdir -p .keepalive
          date -u +'%F %H:%M' > .keepalive/ultimo.txt
          # traer cambios remotos ANTES de commitear, para que el push no sea rechazado
          git pull --rebase --autostash origin main || true
          # re-copiar por si el rebase tocó algo: el estado recién generado manda
          cp estado_aprendizaje.json estado.json
          git add estado.json estado_aprendizaje.json modelos_clima.json .keepalive/ultimo.txt
          git add aviso_enviados.json 2>/dev/null || true
          git commit -m "Actualizacion $(date -u +'%F %H:%M')" || echo "sin cambios que publicar"
          # reintentar el push hasta 3 veces por si alguien empujó en el intervalo
          for i in 1 2 3; do
            if git push; then echo "push OK"; break; fi
            echo "push rechazado, reintentando..."
            git pull --rebase --autostash origin main || true
            cp estado_aprendizaje.json estado.json
            git add estado.json && git commit --amend --no-edit || true
            sleep 5
          done
