name: Monitor Sismico Chile

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-sismico
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6 corre sobre Node 24. Node 20 se elimina de los runners
      # el 16 de septiembre de 2026, así que v4/v5 dejarian de funcionar.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pandas numpy scipy requests
      - name: Escanear sismos, clima y reaprender
        run: python motor_adaptativo.py
      - name: Publicar estado actualizado
        run: |
          cp estado_aprendizaje.json estado.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add estado.json estado_aprendizaje.json modelos_clima.json
          git commit -m "Actualizacion $(date -u +'%F %H:%M')" || echo "sin cambios"
          git pull --rebase --autostash || true
          git push || echo "nada que pushear"
